<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Appointments</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        /* Professional table styling */
        table {
            width: 100%; /* full width */
            border-collapse: collapse;
            margin-top: 20px;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007BFF; /* bootstrap primary blue */
            color: white;
            text-transform: uppercase;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        button {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        button.cancel {
            background-color: #dc3545; /* red */
            color: white;
        }

        button.reschedule {
            background-color: #ffc107; /* yellow */
            color: black;
        }

        #rescheduleDiv {
            padding: 15px;
            border: 1px solid #007BFF;
            border-radius: 8px;
            background-color: #f8f9fa;
            max-width: 500px;
        }

        #rescheduleDiv h3 {
            margin-top: 0;
        }

        #rescheduleSlot {
            padding: 6px;
            margin-right: 10px;
        }

    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">🏥 ClinicCare</div>
    <ul>
        <li><a href="patient-dashboard.html">Dashboard</a></li>
        <li><a href="book-appointment.html">Book Appointment</a></li>
        <li><a href="my-appointments.html" class="active">My Appointments</a></li>
        <li><a href="/patient/logout">Logout</a></li>
    </ul>
</nav>

<div class="dashboard-container">
    <h1>My Appointments</h1>
    <table border="1" cellpadding="10">
        <thead>
        <tr>
            <th>Doctor</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="appointmentsBody">
        <!-- JS will populate rows -->
        </tbody>
    </table>

    <!-- Reschedule Dropdown -->
    <div id="rescheduleDiv" style="display:none; margin-top:20px;">
        <h3>Reschedule Appointment</h3>
        <select id="rescheduleSlot">
            <!-- JS will populate available slots -->
        </select>
        <button onclick="submitReschedule()">Reschedule</button>
        <button onclick="hideReschedule()">Cancel</button>
    </div>
</div>

<script>
    let appointmentToReschedule = null;

    // fetch patient appointments from backend session
    fetch(`/BookAppointment/history/session`) // session-based endpoint in backend
        .then(res => res.json())
        .then(appointments => {
            const tbody = document.getElementById("appointmentsBody");
            tbody.innerHTML = "";
            appointments.forEach(app => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${app.doctorName}</td>
                    <td>${app.date}</td>
                    <td>${app.time}</td>
                    <td>${app.status}</td>
                    <td>
                        ${app.status.toUpperCase() === 'BOOKED' ? `
                        <button onclick="cancelAppointment(${app.appointmentId})">Cancel</button>
                        <button onclick="showReschedule(${app.appointmentId})">Reschedule</button>` : 'N/A'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => console.error(err));

    // Cancel Appointment
    function cancelAppointment(id) {
        if(confirm("Are you sure to cancel?")) {
            fetch(`/BookAppointment/cancel/${id}`, { method: 'PUT' })
                .then(res => res.text())
                .then(msg => {
                    alert(msg);
                    location.reload();
                });
        }
    }

    // Show Reschedule Dropdown
    function showReschedule(appointmentId) {
        appointmentToReschedule = appointmentId;
        const div = document.getElementById("rescheduleDiv");
        div.style.display = "block";

        // fetch available slots for rescheduling
        fetch(`/slot/freeSlots`) // this returns JSON of available slots
            .then(res => res.json())
            .then(slots => {
                const select = document.getElementById("rescheduleSlot");
                select.innerHTML = ""; // clear old options
                slots.forEach(slot => {
                    select.innerHTML += `<option value="${slot.slotId}">
                        ${slot.date} ${slot.time} (${slot.capacity - slot.bookedCount} seats left)
                    </option>`;
                });
            })
            .catch(err => console.error("Error fetching slots:", err));
    }

    // Hide Reschedule
    function hideReschedule() {
        document.getElementById("rescheduleDiv").style.display = "none";
        appointmentToReschedule = null;
    }

    // Submit Reschedule
    function submitReschedule() {
        const newSlotId = document.getElementById("rescheduleSlot").value;
        if(!appointmentToReschedule) return;

        fetch(`/BookAppointment/update?appointmentId=${appointmentToReschedule}&newSlotId=${newSlotId}`, { method: 'PUT' })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                location.reload();
            })
            .catch(err => alert("Error: " + err));
    }
</script>
</body>
</html>
